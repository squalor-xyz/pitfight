#
# Pushing a tag v* runs the checks, builds pit for each release platform with
# scripts/build-release.sh and publishes a GitHub Release with the archives, SHA256SUMS
# and install.sh (everything build-release.sh writes into dist/).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: build
        run: scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "pitfight $GITHUB_REF_NAME" --generate-notes
